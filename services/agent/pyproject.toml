[project]
name = "polymatik-agent"
version = "0.0.0"
description = "Polymatik AI FastAPI service and bounded LangGraph baseline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.161.1",
    "langgraph==1.2.16",
    "langsmith==0.14.12",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymatik_agent"]
